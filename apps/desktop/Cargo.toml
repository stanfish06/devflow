[package]
name = "devflow-desktop"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "devflow-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }
anyhow = "1"
async-channel = "2"
futures = "0.3"
jiff = "0.2"
regex = "1"
uuid = { version = "1", features = ["v7"] }
log = "0.4"
env_logger = "0.11"
# Default TLS uses the platform verifier, which trusts the Caddy CA in the keychain.
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["gpui-fast", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }

# Linux embeds WebKitGTK (through wry) in an X11 child window; versions match lb-wry's.
[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
gdkx11 = "0.18"
gtk = "0.18"
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
x11-dl = "2.21"
