[workspace]
resolver = "3"
members = ["apps/desktop"]

[workspace.package]
edition = "2024"
rust-version = "1.92"

# Line tables keep backtraces readable; full debug info multiplies target/ size several times over.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Optimize GPUI and gpui-kit in debug builds; unoptimized UI code renders slowly (gpui-kit installation guide).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
